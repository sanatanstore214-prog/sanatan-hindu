plugins {
    id 'com.android.application'
}

// Release signing — reads key.properties if present (gitignored). Without it,
// debug still builds and release stays unsigned (so CI/others can build).
def kpf = rootProject.file("key.properties")
def keystoreProps = new Properties()
if (kpf.exists()) { keystoreProps.load(new FileInputStream(kpf)) }

android {
    namespace 'com.sanatanhindu.app'
    // Google Play: 31 Aug 2026 se naye apps/updates ko API 36 (Android 16) target karna zaroori.
    compileSdk 36

    defaultConfig {
        applicationId "com.sanatanhindu.app"
        minSdk 24   // AdMob 25.x requires 24 (Android 7.0+)
        targetSdk 36
        versionCode 12
        versionName "4.0"

        // ============================================================
        // AdMob App ID — abhi GOOGLE TEST ID laga hai (safe).
        // Apna real AdMob App ID yahan dalo jab account ban jaye:
        //   1. https://admob.google.com par account banao (free)
        //   2. App add karo -> "App ID" copy karo (ca-app-pub-XXXX~YYYY)
        //   3. Niche wali line me test ID hatao, apni dalo.
        // WARNING: Testing ke waqt apni real ID + apne phone se ad mat
        // click karo, warna Google account ban kar dega.
        // ============================================================
        manifestPlaceholders = [
            admobAppId: "ca-app-pub-3940256099942544~3347511713"
        ]
    }

    signingConfigs {
        release {
            if (kpf.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (kpf.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Audio assets must stay uncompressed so native MediaPlayer can openFd() them
    androidResources {
        noCompress += ['wav', 'mp3', 'm4a', 'ogg']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // OnBackPressedDispatcher (predictive back, Android 16) + edge-to-edge insets
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    // Background audio (MediaSession + MediaStyle notification)
    implementation 'androidx.media:media:1.7.0'
    // Google AdMob (kamai ke liye) — banner, interstitial, rewarded, app-open.
    // 25.x = supported till Jun 2028 (23.x deprecated, sunset Jun 2027 -> no fill).
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // Google UMP consent (EEA/UK policy compliance; AdMob requires a CMP there)
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
