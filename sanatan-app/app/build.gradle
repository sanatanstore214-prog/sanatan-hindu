plugins {
    id 'com.android.application'
}

// Release signing — reads key.properties if present (gitignored). Without it,
// debug still builds and release stays unsigned (so CI/others can build).
def kpf = rootProject.file("key.properties")
def keystoreProps = new Properties()
if (kpf.exists()) { keystoreProps.load(new FileInputStream(kpf)) }

android {
    namespace 'com.sanatanhindu.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sanatanhindu.app"
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName "3.7"

        // ============================================================
        // AdMob App ID — abhi GOOGLE TEST ID laga hai (safe).
        // Apna real AdMob App ID yahan dalo jab account ban jaye:
        //   1. https://admob.google.com par account banao (free)
        //   2. App add karo -> "App ID" copy karo (ca-app-pub-XXXX~YYYY)
        //   3. Niche wali line me test ID hatao, apni dalo.
        // WARNING: Testing ke waqt apni real ID + apne phone se ad mat
        // click karo, warna Google account ban kar dega.
        // ============================================================
        manifestPlaceholders = [
            admobAppId: "ca-app-pub-3940256099942544~3347511713"
        ]
    }

    signingConfigs {
        release {
            if (kpf.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (kpf.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Audio assets must stay uncompressed so native MediaPlayer can openFd() them
    androidResources {
        noCompress += ['wav', 'mp3', 'm4a', 'ogg']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // Background audio (MediaSession + MediaStyle notification)
    implementation 'androidx.media:media:1.7.0'
    // Google AdMob (kamai ke liye)
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
}
