name: Daily Instagram Post

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install instagrapi==2.5.13 pycryptodomex pillow requests schedule python-dotenv pytrends

      - name: Restore Instagram session
        uses: actions/cache@v4
        with:
          path: ig_session.json
          key: ig-session-v1
          restore-keys: ig-session-

      - name: Create .env
        run: |
          cat > .env << 'ENVEOF'
          GEMINI_API_KEY=AIzaSyC-yL_CsfirmhdZIhvCav9YRQnD-Dr63Bs
          IMGBB_API_KEY=b3c72931acbd147653d4b071f45175cd
          INSTAGRAM_USERNAME=rahul_editzz214
          INSTAGRAM_PASSWORD=Rahul@Nahipata72
          POST_TIME=08:00
          ENVEOF

      - name: Run daily post
        run: python main.py --run-now

      - name: Save Instagram session
        uses: actions/cache@v4
        if: always()
        with:
          path: ig_session.json
          key: ig-session-v1
