name: Daily Instagram Post

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install --no-deps instagrapi==2.5.13 && pip install pycryptodomex pillow requests schedule python-dotenv pytrends httpx pydantic PySocks pytz
        shell: cmd

      - name: Restore Instagram session from secret
        run: |
          $session = $env:IG_SESSION_JSON
          if ($session) {
            [System.IO.File]::WriteAllText("ig_session.json", $session)
            Write-Host "Session restored from secret"
          } else {
            Write-Host "No session secret found"
          }
        shell: powershell
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}

      - name: Create .env
        run: |
          echo GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}> .env
          echo IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}>>.env
          echo INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}>>.env
          echo INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}>>.env
          echo POST_TIME=08:00>>.env
        shell: cmd

      - name: Run daily post
        run: python main.py --run-now
        shell: cmd
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
