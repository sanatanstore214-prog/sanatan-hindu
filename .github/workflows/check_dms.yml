name: Check and Reply DMs

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  dms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --no-deps instagrapi==2.5.13
          pip install pycryptodomex pillow requests schedule python-dotenv pytrends httpx pydantic PySocks pytz

      - name: Restore Instagram session
        uses: actions/cache@v4
        with:
          path: ig_session.json
          key: ig-session-v1
          restore-keys: ig-session-

      - name: Create .env
        run: |
          echo "GEMINI_API_KEY=AIzaSyC-yL_CsfirmhdZIhvCav9YRQnD-Dr63Bs" > .env
          echo "IMGBB_API_KEY=b3c72931acbd147653d4b071f45175cd" >> .env
          echo "INSTAGRAM_USERNAME=rahul_editzz214" >> .env
          echo "INSTAGRAM_PASSWORD=Rahul@Nahipata72" >> .env

      - name: Check and reply DMs
        run: python main.py --check-dms

      - name: Save session
        uses: actions/cache@v4
        if: always()
        with:
          path: ig_session.json
          key: ig-session-v1
