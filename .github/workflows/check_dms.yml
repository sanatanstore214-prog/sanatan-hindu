name: Check & Reply DMs

on:
  schedule:
    # Har 2 ghante (free limit ke andar)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  dms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Instagram session
        uses: actions/cache@v4
        with:
          path: ig_session.json
          key: ig-session-${{ runner.os }}
          restore-keys: ig-session-

      - name: Create .env
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}
          EOF

      - name: Check and reply DMs
        run: python main.py --check-dms

      - name: Save session
        uses: actions/cache@v4
        if: always()
        with:
          path: ig_session.json
          key: ig-session-${{ runner.os }}
