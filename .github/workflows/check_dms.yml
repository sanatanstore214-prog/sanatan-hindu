name: Check and Reply DMs

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  dms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --no-deps instagrapi==2.5.13
          pip install pycryptodomex pillow requests schedule python-dotenv pytrends httpx pydantic PySocks pytz

      - name: Restore Instagram session from secret
        run: |
          if [ -n "$IG_SESSION_JSON" ]; then
            echo "$IG_SESSION_JSON" > ig_session.json
            echo "Session secret se restore hua"
          else
            echo "IG_SESSION_JSON secret nahi mila — cache try karega"
          fi
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}

      - name: Restore session cache (fallback)
        uses: actions/cache@v4
        with:
          path: ig_session.json
          key: ig-session-v2
          restore-keys: ig-session-

      - name: Create .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}" >> .env
          echo "INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}" >> .env
          echo "INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}" >> .env

      - name: Check and reply DMs
        run: python main.py --check-dms
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}

      - name: Save session cache
        uses: actions/cache@v4
        if: always()
        with:
          path: ig_session.json
          key: ig-session-v2
