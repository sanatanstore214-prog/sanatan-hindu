name: Build Sanatan Hindu APK

# Jab bhi sanatan-app me change push hoga, ya manually "Run workflow"
# dabane par, APK ban kar Artifacts me upload ho jayega.
on:
  push:
    paths:
      - 'sanatan-app/**'
      - '.github/workflows/build-sanatan-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Make gradlew executable
        working-directory: sanatan-app
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: sanatan-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SanatanHindu-debug-apk
          path: sanatan-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
