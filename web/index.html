<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sanatan Hindu — आरती, चालीसा, मंत्र, पंचांग</title>
    <meta name="description" content="हनुमान चालीसा, आरती संग्रह, मंत्र और 2026 व्रत-त्योहार कैलेंडर — PC व मोबाइल दोनों पर, ऑफलाइन भी।">
    <meta name="theme-color" content="#D35400">

    <!-- PWA: PC + mobile par app jaisa install -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- =========================================================
         GOOGLE ADSENSE (web ki kamai) — abhi BAND hai.
         Kamai shuru karne ke liye:
           1. https://adsense.google.com par apni site add karke approve karao
           2. Apna Publisher ID milega: ca-pub-XXXXXXXXXXXXXXXX
           3. Niche wali <script> line ka comment hatao aur apna ID dalo
           4. Aur niche .web-ad wale <ins> me bhi apna client + slot dalo
    ========================================================== -->
    <!--
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    -->
</head>
<body>
    <header id="appHeader">
        <button id="backBtn" class="back-btn" aria-label="वापस">‹</button>
        <h1 id="headerTitle">🚩 सनातन हिन्दू</h1>
        <button id="installBtn" class="install-btn">⬇ App install करें</button>
    </header>

    <main id="content"><!-- views injected here --></main>

    <!-- AdSense ad yahan dikhega (PC + mobile) -->
    <div class="web-ad" id="webAd">
        <small>ADVERTISEMENT</small>
        <!-- Apna AdSense ID lagne ke baad ye uncomment karo:
        <ins class="adsbygoogle"
             style="display:block; width:100%"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="0000000000"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
    </div>

    <nav id="bottomNav">
        <button class="nav-btn active" data-view="home">
            <span class="nav-ico">🏠</span><span>होम</span>
        </button>
        <button class="nav-btn" data-view="paath">
            <span class="nav-ico">📿</span><span>आरती</span>
        </button>
        <button class="nav-btn" data-view="mantra">
            <span class="nav-ico">🕉️</span><span>मंत्र</span>
        </button>
        <button class="nav-btn" data-view="calendar">
            <span class="nav-ico">📅</span><span>त्योहार</span>
        </button>
    </nav>

    <script src="data/content.js"></script>
    <script src="js/app.js"></script>

    <!-- PWA: service worker (offline) + install prompt -->
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("service-worker.js").catch(function () {});
        });
    }
    // Install button (Chrome/Edge desktop + Android Chrome)
    var deferredPrompt = null;
    var installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.add("show");
    });
    installBtn.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
            deferredPrompt = null;
            installBtn.classList.remove("show");
        });
    });
    window.addEventListener("appinstalled", function () {
        installBtn.classList.remove("show");
    });
    </script>
</body>
</html>
