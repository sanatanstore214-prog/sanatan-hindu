<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sanatan Hindu — आरती, चालीसा, मंत्र, त्योहार</title>
<style>
:root {
    --saffron: #FF7722;
    --saffron-dark: #D35400;
    --maroon: #7B241C;
    --cream: #FFF8EE;
    --gold: #C9A227;
    --card: #FFFFFF;
    --text: #2B2118;
    --muted: #8a7a68;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--text);
    font-family: "Noto Sans Devanagari", "Segoe UI", Roboto, system-ui, sans-serif;
    height: 100%;
}

body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* Header */
#appHeader {
    background: linear-gradient(135deg, var(--saffron), var(--saffron-dark));
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 10;
}
#headerTitle { font-size: 19px; margin: 0; font-weight: 700; }
.back-btn {
    display: none;
    background: rgba(255,255,255,.2);
    border: none;
    color: #fff;
    font-size: 26px;
    line-height: 1;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
}
body.detail .back-btn { display: block; }

/* Content */
#content {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* Cards */
.card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(123,36,28,.08);
    border-left: 4px solid var(--saffron);
}
.card.tap { cursor: pointer; display: flex; align-items: center; gap: 12px; }
.card.tap:active { transform: scale(.99); }
.card-ico { font-size: 28px; flex-shrink: 0; }
.card-body h3 { margin: 0 0 2px; font-size: 17px; color: var(--maroon); }
.card-body p { margin: 0; font-size: 13px; color: var(--muted); }
.chev { margin-left: auto; color: var(--saffron); font-size: 22px; }

/* Home hero */
.hero {
    background: linear-gradient(135deg, var(--maroon), #a83327);
    color: #fff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
}
.hero .om { font-size: 40px; }
.hero .date { font-size: 14px; opacity: .9; margin-top: 4px; }
.hero .thought {
    margin-top: 12px;
    font-size: 15px;
    font-style: italic;
    background: rgba(255,255,255,.12);
    padding: 12px;
    border-radius: 10px;
}

.section-title {
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin: 18px 4px 8px;
    font-weight: 700;
}

/* Reader (detail) */
.reader-title {
    color: var(--maroon);
    font-size: 22px;
    text-align: center;
    margin: 6px 0 4px;
}
.reader-sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
}
.reader-text {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    white-space: pre-wrap;
    line-height: 2;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(123,36,28,.08);
}
.reader-meaning {
    background: #fff4e2;
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.7;
}
.reader-meaning b { color: var(--maroon); }

/* Calendar */
.fest-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(123,36,28,.07);
}
.fest-row.past { opacity: .5; }
.fest-row.next { border: 2px solid var(--saffron); }
.fest-date {
    background: var(--saffron);
    color: #fff;
    border-radius: 10px;
    min-width: 54px;
    text-align: center;
    padding: 6px 4px;
    line-height: 1.1;
}
.fest-date .d { font-size: 20px; font-weight: 800; }
.fest-date .m { font-size: 11px; text-transform: uppercase; }
.fest-info h3 { margin: 0; font-size: 16px; color: var(--maroon); }
.fest-info p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.badge-next {
    margin-left: auto;
    background: var(--gold);
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
}
.disclaimer {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin: 8px 4px 0;
    line-height: 1.5;
}

/* Bottom nav */
#bottomNav {
    display: flex;
    background: #fff;
    border-top: 1px solid #eee;
    box-shadow: 0 -2px 8px rgba(0,0,0,.06);
}
.nav-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 0 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
}
.nav-btn .nav-ico { font-size: 20px; }
.nav-btn.active { color: var(--saffron-dark); font-weight: 700; }
body.detail #bottomNav { display: none; }

.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ============================================================
   WEB / PWA additions (PC + mobile browser ke liye)
   ============================================================ */

/* Bade screen (PC) par app ko beech me phone-jaisa column banao */
html { background: #e9ddc9; }
body {
    max-width: 600px;
    margin: 0 auto;
    box-shadow: 0 0 30px rgba(0,0,0,.15);
    min-height: 100vh;
}

/* AdSense ad slot */
.web-ad {
    background: #fff;
    border-top: 1px solid #eee;
    text-align: center;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.web-ad small { color: #c9bfae; font-size: 10px; letter-spacing: 1px; }

/* "Install app" button (PWA) */
.install-btn {
    display: none;
    background: rgba(255,255,255,.25);
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    margin-left: auto;
    cursor: pointer;
    white-space: nowrap;
}
.install-btn.show { display: inline-block; }

</style>
</head>
<body>
<header id="appHeader">
  <button id="backBtn" class="back-btn" aria-label="वापस">‹</button>
  <h1 id="headerTitle">🚩 सनातन हिन्दू</h1>
</header>
<main id="content"></main>
<nav id="bottomNav">
  <button class="nav-btn active" data-view="home"><span class="nav-ico">🏠</span><span>होम</span></button>
  <button class="nav-btn" data-view="paath"><span class="nav-ico">📿</span><span>आरती</span></button>
  <button class="nav-btn" data-view="mantra"><span class="nav-ico">🕉️</span><span>मंत्र</span></button>
  <button class="nav-btn" data-view="calendar"><span class="nav-ico">📅</span><span>त्योहार</span></button>
</nav>
<script>
/*
 * Sanatan Hindu — offline content data.
 * Naya path/mantra/tyohar add karna ho to bas is file me jodo.
 * (text me \n se nayi line banti hai)
 */
window.SANATAN_DATA = {

  // ---- Daily shubh vichar (Home par rotate hote hain) ----
  thoughts: [
    "कर्म करो, फल की चिंता मत करो। — श्रीमद्भगवद्गीता",
    "जैसा अन्न, वैसा मन। शुद्ध भोजन, शुद्ध विचार।",
    "अहिंसा परमो धर्मः — सबसे बड़ा धर्म है किसी को दुख न देना।",
    "सत्यमेव जयते — सत्य की ही विजय होती है।",
    "जो हुआ अच्छा हुआ, जो हो रहा अच्छा हो रहा, जो होगा वो भी अच्छा ही होगा।",
    "मन को जीत लिया तो जग जीत लिया।",
    "वसुधैव कुटुम्बकम् — सारा संसार एक परिवार है।",
    "श्रद्धा और धैर्य रखो, ईश्वर सब देखता है।"
  ],

  // ---- Aarti / Chalisa / Path ----
  paath: [
    {
      id: "hanuman-chalisa",
      title: "श्री हनुमान चालीसा",
      subtitle: "तुलसीदास रचित",
      icon: "🚩",
      text:
`॥ दोहा ॥
श्रीगुरु चरन सरोज रज, निज मनु मुकुरु सुधारि।
बरनउँ रघुबर बिमल जसु, जो दायकु फल चारि॥
बुद्धिहीन तनु जानिके, सुमिरौं पवन कुमार।
बल बुद्धि बिद्या देहु मोहिं, हरहु कलेस बिकार॥

॥ चौपाई ॥
जय हनुमान ज्ञान गुन सागर।
जय कपीस तिहुँ लोक उजागर॥
राम दूत अतुलित बल धामा।
अंजनि पुत्र पवनसुत नामा॥
महाबीर बिक्रम बजरंगी।
कुमति निवार सुमति के संगी॥
कंचन बरन बिराज सुबेसा।
कानन कुंडल कुंचित केसा॥
हाथ बज्र औ ध्वजा बिराजै।
काँधे मूँज जनेऊ साजै॥
शंकर सुवन केसरी नंदन।
तेज प्रताप महा जग बंदन॥
विद्यावान गुनी अति चातुर।
राम काज करिबे को आतुर॥
प्रभु चरित्र सुनिबे को रसिया।
राम लखन सीता मन बसिया॥
सूक्ष्म रूप धरि सियहिं दिखावा।
बिकट रूप धरि लंक जरावा॥
भीम रूप धरि असुर सँहारे।
रामचंद्र के काज सँवारे॥
लाय सजीवन लखन जियाये।
श्रीरघुबीर हरषि उर लाये॥
रघुपति कीन्ही बहुत बड़ाई।
तुम मम प्रिय भरतहि सम भाई॥
सहस बदन तुम्हरो जस गावैं।
अस कहि श्रीपति कंठ लगावैं॥
सनकादिक ब्रह्मादि मुनीसा।
नारद सारद सहित अहीसा॥
जम कुबेर दिगपाल जहाँ ते।
कबि कोबिद कहि सके कहाँ ते॥
तुम उपकार सुग्रीवहिं कीन्हा।
राम मिलाय राज पद दीन्हा॥
तुम्हरो मंत्र बिभीषन माना।
लंकेश्वर भए सब जग जाना॥
जुग सहस्र जोजन पर भानू।
लील्यो ताहि मधुर फल जानू॥
प्रभु मुद्रिका मेलि मुख माहीं।
जलधि लाँघि गये अचरज नाहीं॥
दुर्गम काज जगत के जेते।
सुगम अनुग्रह तुम्हरे तेते॥
राम दुआरे तुम रखवारे।
होत न आज्ञा बिनु पैसारे॥
सब सुख लहै तुम्हारी सरना।
तुम रच्छक काहू को डर ना॥
आपन तेज सम्हारो आपै।
तीनों लोक हाँक तें काँपै॥
भूत पिसाच निकट नहिं आवै।
महाबीर जब नाम सुनावै॥
नासै रोग हरै सब पीरा।
जपत निरंतर हनुमत बीरा॥
संकट तें हनुमान छुड़ावै।
मन क्रम बचन ध्यान जो लावै॥
सब पर राम तपस्वी राजा।
तिन के काज सकल तुम साजा॥
और मनोरथ जो कोई लावै।
सोइ अमित जीवन फल पावै॥
चारों जुग परताप तुम्हारा।
है परसिद्ध जगत उजियारा॥
साधु संत के तुम रखवारे।
असुर निकंदन राम दुलारे॥
अष्ट सिद्धि नौ निधि के दाता।
अस बर दीन्ह जानकी माता॥
राम रसायन तुम्हरे पासा।
सदा रहो रघुपति के दासा॥
तुम्हरे भजन राम को पावै।
जनम जनम के दुख बिसरावै॥
अंत काल रघुबर पुर जाई।
जहाँ जन्म हरिभक्त कहाई॥
और देवता चित्त न धरई।
हनुमत सेइ सर्ब सुख करई॥
संकट कटै मिटै सब पीरा।
जो सुमिरै हनुमत बलबीरा॥
जय जय जय हनुमान गोसाईं।
कृपा करहु गुरुदेव की नाईं॥
जो सत बार पाठ कर कोई।
छूटहि बंदि महा सुख होई॥
जो यह पढ़ै हनुमान चालीसा।
होय सिद्धि साखी गौरीसा॥
तुलसीदास सदा हरि चेरा।
कीजै नाथ हृदय महँ डेरा॥

॥ दोहा ॥
पवनतनय संकट हरन, मंगल मूरति रूप।
राम लखन सीता सहित, हृदय बसहु सुर भूप॥`

    {
      id: "ganesh-aarti",
      title: "श्री गणेश आरती",
      subtitle: "जय गणेश जय गणेश देवा",
      icon: "🙏",
      text:
`जय गणेश जय गणेश, जय गणेश देवा।
माता जाकी पार्वती, पिता महादेवा॥

एक दंत दयावंत, चार भुजा धारी।
माथे सिंदूर सोहे, मूसे की सवारी॥

पान चढ़े फूल चढ़े, और चढ़े मेवा।
लड्डुअन का भोग लगे, संत करें सेवा॥

अंधन को आँख देत, कोढ़िन को काया।
बाँझन को पुत्र देत, निर्धन को माया॥

सूर श्याम शरण आए, सफल कीजे सेवा।
माता जाकी पार्वती, पिता महादेवा॥

दीनन की लाज रखो, शम्भु सुतकारी।
कामना को पूर्ण करो, जग बलिहारी॥

जय गणेश जय गणेश, जय गणेश देवा।
माता जाकी पार्वती, पिता महादेवा॥`
    },
    {
      id: "om-jai-jagdish",
      title: "ॐ जय जगदीश हरे",
      subtitle: "विष्णु आरती",
      icon: "🪔",
      text:
`ॐ जय जगदीश हरे, स्वामी जय जगदीश हरे।
भक्त जनों के संकट, दास जनों के संकट,
क्षण में दूर करे॥ ॐ जय जगदीश हरे॥

जो ध्यावे फल पावे, दुख बिनसे मन का।
सुख सम्पति घर आवे, कष्ट मिटे तन का॥
॥ ॐ जय जगदीश हरे॥

मात-पिता तुम मेरे, शरण गहूँ किसकी।
तुम बिन और न दूजा, आस करूँ जिसकी॥
॥ ॐ जय जगदीश हरे॥

तुम पूरन परमात्मा, तुम अंतरयामी।
पारब्रह्म परमेश्वर, तुम सबके स्वामी॥
॥ ॐ जय जगदीश हरे॥

तुम करुणा के सागर, तुम पालनकर्ता।
मैं मूरख खल कामी, कृपा करो भर्ता॥
॥ ॐ जय जगदीश हरे॥

तुम हो एक अगोचर, सबके प्राणपति।
किस विधि मिलूँ दयामय, तुमको मैं कुमति॥
॥ ॐ जय जगदीश हरे॥

दीनबन्धु दुखहर्ता, तुम ठाकुर मेरे।
अपने हाथ उठाओ, द्वार पड़ा तेरे॥
॥ ॐ जय जगदीश हरे॥

विषय विकार मिटाओ, पाप हरो देवा।
श्रद्धा भक्ति बढ़ाओ, संतन की सेवा॥
॥ ॐ जय जगदीश हरे॥`
    },
    {
      id: "shiv-aarti",
      title: "ॐ जय शिव ओंकारा",
      subtitle: "शिव आरती",
      icon: "🔱",
      text:
`ॐ जय शिव ओंकारा, स्वामी जय शिव ओंकारा।
ब्रह्मा विष्णु सदाशिव, अर्द्धांगी धारा॥
॥ ॐ जय शिव ओंकारा॥

एकानन चतुरानन पंचानन राजे।
हंसासन गरुड़ासन वृषवाहन साजे॥
॥ ॐ जय शिव ओंकारा॥

दो भुज चार चतुर्भुज दसभुज अति सोहे।
त्रिगुण रूप निरखता त्रिभुवन जन मोहे॥
॥ ॐ जय शिव ओंकारा॥

अक्षमाला वनमाला मुण्डमाला धारी।
चंदन मृगमद सोहे, भाले शशिधारी॥
॥ ॐ जय शिव ओंकारा॥

श्वेताम्बर पीताम्बर बाघम्बर अंगे।
सनकादिक गरुणादिक भूतादिक संगे॥
॥ ॐ जय शिव ओंकारा॥

कर के मध्य कमण्डलु चक्र त्रिशूलधारी।
सुखकारी दुखहारी जगपालनकारी॥
॥ ॐ जय शिव ओंकारा॥

ब्रह्मा विष्णु सदाशिव जानत अविवेका।

कहत शिवानन्द स्वामी मनवांछित फल पावे॥
॥ ॐ जय शिव ओंकारा॥`

॥ जय अम्बे गौरी॥

शुम्भ-निशुम्भ बिदारे, महिषासुर घाती।

॥ जय अम्बे गौरी॥

तुम ही जग की माता, तुम ही हो भरता।

॥ जय अम्बे गौरी॥

श्री अम्बे जी की आरती, जो कोई नर गावे।
कहत शिवानन्द स्वामी, सुख सम्पति पावे॥
॥ जय अम्बे गौरी॥`
    },

      meaning: "उस प्राणस्वरूप, दुखनाशक, सुखस्वरूप, श्रेष्ठ, तेजस्वी, पापनाशक देव को हम धारण करें; वह हमारी बुद्धि को सन्मार्ग पर प्रेरित करे।"

      meaning: "भगवान कृष्ण और राम के नाम का कीर्तन — मन की शुद्धि और भक्ति का सरलतम मार्ग।"

</script>
<script>
(function () {
  "use strict";

  // Purane WebView me NodeList.forEach nahi hota — isliye apna loop helper.
  function each(list, fn) {
    if (!list) return;
    for (var i = 0; i < list.length; i++) fn(list[i], i);
  }

  try {
    start();
  } catch (e) {
    // White screen ki jagah error dikhao (debug me kaam aata hai)
    var c = document.getElementById("content");
    if (c) {
      c.innerHTML = '<div style="padding:30px;text-align:center;color:#7B241C">' +
        '<h2>🚩 सनातन हिन्दू</h2><p>Kuch gadbad ho gayi.</p>' +
        '<p style="font-size:12px;color:#999">' + String(e && e.message) + '</p></div>';
    }
  }

  function start() {
    var DATA = window.SANATAN_DATA || { thoughts: [], paath: [], mantra: [], festivals: [] };

    var HIN_MONTHS = ["जन", "फर", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अग", "सित", "अक्तू", "नव", "दिस"];
    var HIN_MONTHS_FULL = ["जनवरी", "फरवरी", "मार्च", "अप्रैल", "मई", "जून", "जुलाई", "अगस्त", "सितम्बर", "अक्टूबर", "नवम्बर", "दिसम्बर"];
    var HIN_DAYS = ["रविवार", "सोमवार", "मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];

    var content = document.getElementById("content");
    var headerTitle = document.getElementById("headerTitle");
    var backBtn = document.getElementById("backBtn");
    var navBtns = document.querySelectorAll(".nav-btn");

    var currentTab = "home";
    var supportsPush = typeof history !== "undefined" && typeof history.pushState === "function";

    function notifyNavigate() {
      try {
        if (window.Android && typeof window.Android.onNavigate === "function") {
          window.Android.onNavigate();
        }
      } catch (e) {}
    }

    function el(html) {
      var d = document.createElement("div");
      d.innerHTML = html.replace(/^\s+|\s+$/g, "");
      return d.firstChild;
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    // ---------------- HOME ----------------
    function renderHome() {
      var now = new Date();
      var dateStr = HIN_DAYS[now.getDay()] + ", " + now.getDate() + " " + HIN_MONTHS_FULL[now.getMonth()] + " " + now.getFullYear();
      var thought = DATA.thoughts.length ? DATA.thoughts[now.getDate() % DATA.thoughts.length] : "";
      var next = nextFestival();

      var html = '<div class="fade">';
      html += '<div class="hero">' +
        '<div class="om">ॐ</div>' +
        '<div style="font-size:18px;font-weight:700">श्री गणेशाय नमः</div>' +
        '<div class="date">' + esc(dateStr) + '</div>' +
        '<div class="thought">“' + esc(thought) + '”</div>' +
        '</div>';

      if (next) {
        html += '<div class="section-title">अगला त्योहार</div>';
        html += '<div class="card tap" data-go="calendar">' +
          '<span class="card-ico">📅</span>' +
          '<div class="card-body"><h3>' + esc(next.name) + '</h3>' +
          '<p>' + esc(formatFull(next._d)) + (next._days === 0 ? " · आज" : " · " + next._days + " दिन बाद") + '</p></div>' +
          '<span class="chev">›</span></div>';
      }

      html += '<div class="section-title">रोज़ का पाठ</div>';
      html += quickCard("📿", "आरती व चालीसा", "हनुमान चालीसा, गणेश-शिव आरती…", "paath");
      html += quickCard("🕉️", "मंत्र संग्रह", "गायत्री, महामृत्युंजय व अन्य", "mantra");
      html += quickCard("📅", "व्रत व त्योहार 2026", "पूरे साल का कैलेंडर", "calendar");
      html += "</div>";

      content.innerHTML = "";
      content.appendChild(el(html));
      bindGoCards();
    }

    function quickCard(ico, title, sub, go) {
      return '<div class="card tap" data-go="' + go + '">' +
        '<span class="card-ico">' + ico + '</span>' +
        '<div class="card-body"><h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p></div>' +
        '<span class="chev">›</span></div>';
    }

    function bindGoCards() {
      each(content.querySelectorAll("[data-go]"), function (c) {
        c.addEventListener("click", function () { switchTab(c.getAttribute("data-go")); });
      });
    }

    // ---------------- LIST (paath / mantra) ----------------
    function renderList(type) {
      var items = DATA[type] || [];
      var html = '<div class="fade">';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        html += '<div class="card tap" data-type="' + type + '" data-idx="' + i + '">' +
          '<span class="card-ico">' + (it.icon || (type === "mantra" ? "🕉️" : "📖")) + '</span>' +
          '<div class="card-body"><h3>' + esc(it.title) + '</h3>' +
          (it.subtitle ? '<p>' + esc(it.subtitle) + '</p>' : '') + '</div>' +
          '<span class="chev">›</span></div>';
      }
      html += "</div>";
      content.innerHTML = "";
      content.appendChild(el(html));
      each(content.querySelectorAll("[data-idx]"), function (c) {
        c.addEventListener("click", function () {
          openDetail(c.getAttribute("data-type"), parseInt(c.getAttribute("data-idx"), 10));
        });
      });
    }

    // ---------------- DETAIL ----------------
    function openDetail(type, idx) {
      var it = (DATA[type] || [])[idx];
      if (!it) return;
      notifyNavigate();

      var html = '<div class="fade">' +
        '<h2 class="reader-title">' + esc(it.title) + '</h2>' +
        (it.subtitle ? '<div class="reader-sub">' + esc(it.subtitle) + '</div>' : '') +
        '<div class="reader-text">' + esc(it.text) + '</div>';
      if (it.meaning) {
        html += '<div class="reader-meaning"><b>अर्थ:</b> ' + esc(it.meaning) + '</div>';
      }
      html += '</div>';

      content.innerHTML = "";
      content.appendChild(el(html));
      content.scrollTop = 0;
      document.body.className = "detail";
      headerTitle.textContent = it.title;
      if (supportsPush) {
        try { history.pushState({ detail: true, tab: currentTab }, ""); } catch (e) {}
      }
    }

    function closeDetail() {
      document.body.className = "";
      showTab(currentTab, false);
    }

    // ---------------- CALENDAR ----------------
    function parseDate(s) {
      var p = s.split("-");
      return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    }
    function startOfToday() {
      var n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate());
    }
    function formatFull(d) {
      return d.getDate() + " " + HIN_MONTHS_FULL[d.getMonth()] + " " + d.getFullYear();
    }
    function nextFestival() {
      var today = startOfToday();
      var best = null;
      var fests = DATA.festivals || [];
      for (var i = 0; i < fests.length; i++) {
        var d = parseDate(fests[i].date);
        if (d >= today && (!best || d < best._d)) {
          best = { name: fests[i].name, note: fests[i].note, _d: d };
        }
      }
      if (best) best._days = Math.round((best._d - today) / 86400000);
      return best;
    }

    function renderCalendar() {
      var today = startOfToday();
      var next = nextFestival();
      var nextTime = next ? next._d.getTime() : -1;
      var fests = DATA.festivals || [];

      var html = '<div class="fade">';
      html += '<div class="section-title">व्रत व त्योहार 2026</div>';
      for (var i = 0; i < fests.length; i++) {
        var f = fests[i];
        var d = parseDate(f.date);
        var past = d < today;
        var isNext = d.getTime() === nextTime;
        html += '<div class="fest-row ' + (past ? "past" : "") + (isNext ? " next" : "") + '">' +
          '<div class="fest-date"><div class="d">' + d.getDate() + '</div>' +
          '<div class="m">' + HIN_MONTHS[d.getMonth()] + '</div></div>' +
          '<div class="fest-info"><h3>' + esc(f.name) + '</h3>' +
          '<p>' + esc(HIN_DAYS[d.getDay()]) + (f.note ? " · " + esc(f.note) : "") + '</p></div>' +
          (isNext ? '<span class="badge-next">अगला</span>' : '') +
          '</div>';
      }
      html += '<p class="disclaimer">⚠️ तिथि के अनुसार तारीख़ 1-2 दिन आगे-पीछे हो सकती है। अपने स्थानीय पंचांग से पुष्टि करें।</p>';
      html += "</div>";
      content.innerHTML = "";
      content.appendChild(el(html));
    }

    // ---------------- TAB SWITCH ----------------
    function showTab(tab, notify) {
      currentTab = tab;
      each(navBtns, function (b) {
        if (b.getAttribute("data-view") === tab) b.className = "nav-btn active";
        else b.className = "nav-btn";
      });
      headerTitle.textContent =
        tab === "home" ? "🚩 सनातन हिन्दू" :
        tab === "paath" ? "📿 आरती व चालीसा" :
        tab === "mantra" ? "🕉️ मंत्र संग्रह" : "📅 व्रत व त्योहार";

      if (tab === "home") renderHome();
      else if (tab === "paath") renderList("paath");
      else if (tab === "mantra") renderList("mantra");
      else if (tab === "calendar") renderCalendar();

      content.scrollTop = 0;
      if (notify) notifyNavigate();
    }

    function switchTab(tab) {
      if (document.body.className.indexOf("detail") !== -1) {
        document.body.className = "";
        if (supportsPush) { try { history.back(); } catch (e) {} }
      }
      showTab(tab, true);
    }

    // ---------------- EVENTS ----------------
    each(navBtns, function (b) {
      b.addEventListener("click", function () { switchTab(b.getAttribute("data-view")); });
    });
    backBtn.addEventListener("click", function () {
      if (supportsPush) { try { history.back(); } catch (e) {} }
      closeDetail();
    });

    window.addEventListener("popstate", function () {
      if (document.body.className.indexOf("detail") !== -1) closeDetail();
    });

    // Start
    showTab("home", false);
  }
})();

</script>
</body>
</html>
